# Incident Responder: system under investigation + observability stack + harness.
#
# Shop services are built from ./target-repo, a separate git repo created by
# `make target-init` (the deploy simulator commits there). Every service-to-
# dependency connection goes through Toxiproxy, the fault-injection point.
# Host ports are bound to 127.0.0.1 only.
name: incident-responder

services:
  # ---------------------------------------------------------------- data stores
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: shop
      POSTGRES_USER: shop
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-incident}
    volumes:
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shop -d shop"]
      interval: 3s
      timeout: 3s
      retries: 40
    restart: unless-stopped

  # ------------------------------------------------- fault-injection (harness)
  toxiproxy:
    image: ghcr.io/shopify/toxiproxy:2.12.0
    command: ["-host=0.0.0.0", "-config=/config/toxiproxy.json"]
    volumes:
      - ./infra/toxiproxy/toxiproxy.json:/config/toxiproxy.json:ro
    ports:
      - "127.0.0.1:8474:8474"   # control API, used only by the chaos CLI
    restart: unless-stopped

  # ------------------------------------------------------------- shop services
  gateway:
    build:
      context: ./target-repo
      args: {SERVICE: gateway, COMMIT: "${TARGET_COMMIT:-unknown}"}
    image: incident-responder/gateway:local
    ports: ["127.0.0.1:8080:8080"]
    depends_on:
      toxiproxy: {condition: service_started}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/healthz"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  order:
    build:
      context: ./target-repo
      args: {SERVICE: order, COMMIT: "${TARGET_COMMIT:-unknown}"}
    image: incident-responder/order:local
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-incident}
    ports: ["127.0.0.1:8081:8081"]
    depends_on:
      postgres: {condition: service_healthy}
      toxiproxy: {condition: service_started}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8081/healthz"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  payment:
    build:
      context: ./target-repo
      args: {SERVICE: payment, COMMIT: "${TARGET_COMMIT:-unknown}"}
    image: incident-responder/payment:local
    ports: ["127.0.0.1:8082:8082"]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8082/healthz"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  # Phase 2: inventory, notification, redis, nats

  # ---------------------------------------------------- background traffic
  loadgen:
    build: ./loadgen
    image: incident-responder/loadgen:local
    # Phase 1: no inventory yet, so no product listing in the mix.
    command: ["--target=http://gateway:8080", "--rps=${LOADGEN_RPS:-10}", "--mix=create=75,get=25"]
    depends_on:
      gateway: {condition: service_healthy}
    restart: unless-stopped

  # ------------------------------------------------------------ observability
  prometheus:
    image: prom/prometheus:v3.5.0
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=2d"]
    volumes:
      - ./infra/prometheus:/etc/prometheus:ro
    ports: ["127.0.0.1:9090:9090"]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9090/-/ready"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  loki:
    image: grafana/loki:3.5.3
    command: ["-config.file=/etc/loki/config.yml"]
    volumes:
      - ./infra/loki/config.yml:/etc/loki/config.yml:ro
    ports: ["127.0.0.1:3100:3100"]
    restart: unless-stopped

  alloy:
    image: grafana/alloy:v1.10.1
    command: ["run", "--server.http.listen-addr=0.0.0.0:12345", "--storage.path=/var/lib/alloy/data", "/etc/alloy/config.alloy"]
    volumes:
      - ./infra/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on: [loki]
    restart: unless-stopped

  grafana:
    image: grafana/grafana:12.1.1
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/provisioning/dashboards/shop.json
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
    ports: ["127.0.0.1:3000:3000"]
    depends_on: [prometheus, loki]
    restart: unless-stopped
