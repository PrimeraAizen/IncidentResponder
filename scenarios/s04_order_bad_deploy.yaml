id: s04_order_bad_deploy
description: A deploy of order adds a nil-pointer bug (loyalty promotions) - most new orders panic.
setup:
  - deploy: {service: order, patch: s04_order_promotions.patch}
warmup_s: 120
observe_s: 90
alert:
  alert_name: HighErrorRate
  service: gateway
  severity: critical
  summary: "5xx ratio of gateway requests > 5%"
expected:
  root_cause_service: order
  fault_type: bad_deploy
  suspect_commit: from_deploy     # the commit made by the deploy step above
  accepted_services: []
  must_not_blame: []
symptom:
  - description: gateway 5xx ratio
    promql: 'sum(rate(http_requests_total{service="gateway",status=~"5.."}[1m])) / sum(rate(http_requests_total{service="gateway"}[1m]))'
    above: 0.1
