[project]
name = "responder"
version = "0.1.0"
description = "Multi-agent incident root-cause analysis for a microservice backend"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=0.6",
    "pydantic>=2.7",
    "openai>=1.40",
    "httpx>=0.27",
    "tenacity>=8.5",
    "docker>=7.1",
    "typer>=0.12",
    "rich>=13.7",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
]

[project.scripts]
responder = "responder.cli:app"

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["responder"]

[tool.pytest.ini_options]
testpaths = ["tests"]
